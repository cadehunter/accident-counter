<!DOCTYPE html>
<html>
	<head>
		<title>Counter</title>
		<style>
			body {
				background: black;
				width: 100%;
				height: 100%;
				position: fixed;
				display: flex;
				justify-content: center;
				align-items: center;
			}
			.counter {
				margin: 0;
				text-align: center;
				font-size: 100px;
				font-family: "Inter", sans-serif;
				font-optical-sizing: auto;
				font-style: normal;
				color: white;
				display: flex;
				justify-content: center;
				align-items: center;
			}
			.counter.animate {
				animation: text-update 5.1375294277s linear;
			}

			@keyframes text-update {
				from {
					opacity: 1;
				}
				to {
					opacity: 0.5;
				}
			}
		</style>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
	</head>
	<body>
		<h1 class="counter animate">0</h1>

		<script>
			var counter = 0;
			var counterElement = document.querySelector(".counter");
			setInterval(function () {
				counterElement.classList.remove("animate");
				counterElement.textContent = ++counter;
				void counterElement.offsetWidth;
				counterElement.classList.add("animate");
			}, 5.1375294277 * 1000);

			counterElement.onclick = document.documentElement.requestFullscreen;
		</script>
	</body>
</html>
